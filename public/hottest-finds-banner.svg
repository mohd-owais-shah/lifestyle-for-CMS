<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1276 214" width="1276" height="214">
  <defs>
    <!-- Pixel stamp heart left -->
    <g id="pixel-stamp-heart-left">
      <!-- Outer serrated/pixel heart stamp -->
      <path fill="#ffffff" d="M 6 0 H 16 V 3 H 20 V 6 H 24 V 10 H 26 V 16 H 24 V 20 H 20 V 24 H 16 V 28 H 12 V 32 H 8 V 28 H 4 V 24 H 0 V 16 H 2 V 10 H 6 V 6 H 10 V 3 H 6 Z" transform="scale(1.1) rotate(-6)" />
      <!-- Cutout inner pixel dot -->
      <rect x="8" y="8" width="2" height="2" fill="#BA8E62" />
    </g>

    <!-- Pixel stamp heart right -->
    <g id="pixel-stamp-heart-right">
      <path fill="#ffffff" d="M 6 0 H 16 V 3 H 20 V 6 H 24 V 10 H 26 V 16 H 24 V 20 H 20 V 24 H 16 V 28 H 12 V 32 H 8 V 28 H 4 V 24 H 0 V 16 H 2 V 10 H 6 V 6 H 10 V 3 H 6 Z" transform="scale(1.1) rotate(6)" />
      <rect x="8" y="8" width="2" height="2" fill="#BA8E62" />
    </g>

    <!-- Wavy Checkered Pattern Filter -->
    <pattern id="wavy-checkers" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <rect width="40" height="40" fill="#A87E52" />
      <rect x="40" y="0" width="40" height="40" fill="#C59E75" />
      <rect x="0" y="40" width="40" height="40" fill="#C59E75" />
      <rect x="40" y="40" width="40" height="40" fill="#A87E52" />
    </pattern>

    <!-- Lens / Wave warp mesh -->
    <radialGradient id="wave-warp" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#BA8E62" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#BA8E62" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#BA8E62" stop-opacity="0.75" />
    </radialGradient>
  </defs>

  <!-- Base Tan Canvas -->
  <rect width="100%" height="100%" fill="#BA8E62" />

  <!-- Checkered Wave Pattern -->
  <rect width="100%" height="100%" fill="url(#wavy-checkers)" opacity="0.9" />

  <!-- Center warp overlay -->
  <rect width="100%" height="100%" fill="url(#wave-warp)" />

  <!-- Left Pixel Heart Stamp -->
  <use href="#pixel-stamp-heart-left" x="260" y="92" />

  <!-- Center Typography matching exact Didone / Georgia high contrast serif font -->
  <text x="638" y="128" font-family="'Didot', 'Bodoni MT', 'Cinzel', 'Georgia', serif" font-size="64" font-weight="700" letter-spacing="12" fill="#ffffff" text-anchor="middle" style="filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.25));">HOTTEST FINDS</text>

  <!-- Right Pixel Heart Stamp -->
  <use href="#pixel-stamp-heart-right" x="980" y="92" />
</svg>
