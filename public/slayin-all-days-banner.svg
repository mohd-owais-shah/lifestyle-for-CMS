<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1276 214" width="1276" height="214">
  <defs>
    <!-- Pixel Heart Black -->
    <g id="pixel-heart-black">
      <path fill="#141414" d="M4 2h4v2H4zm8 0h4v2h-4zM2 4h8v2H2zm8 0h8v2h-8zM2 6h16v2H2zm2 2h12v2H4zm2 2h8v2H6zm2 2h4v2H8zm1 2h2v1H9z" />
    </g>
    <!-- Wavy line pattern -->
    <pattern id="slayin-waves" width="100" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q 25 20, 50 10 T 100 10" fill="none" stroke="#E5C300" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Bright Yellow Base -->
  <rect width="100%" height="100%" fill="#FCD800" />
  <rect width="100%" height="100%" fill="url(#slayin-waves)" opacity="0.6" />

  <!-- Pixel Heart Left -->
  <use href="#pixel-heart-black" x="350" y="90" transform="scale(1.2) translate(-60, -10)" />

  <!-- Center Typography -->
  <text x="638" y="126" font-family="'Times New Roman', Georgia, serif" font-size="52" font-weight="900" letter-spacing="8" fill="#141414" text-anchor="middle">SLAYIN' ALL DAYS</text>

  <!-- Pixel Heart Right -->
  <use href="#pixel-heart-black" x="900" y="90" transform="scale(1.2) translate(10, -10)" />
</svg>
